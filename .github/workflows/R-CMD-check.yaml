# R CMD check --as-cran, which had no way to run before this existed: R is not
# installed on the dev box and the repo had no .github/ at all, so issue #1's
# step 3 ("run R CMD check --as-cran on r-devel") was unactionable. Running it
# here rather than installing R locally also keeps it off a box that sits near
# its disk ceiling.
#
# r-devel is included deliberately: CRAN checks submissions against it, and it
# is where a NOTE that blocks acceptance usually appears first.
#
# man/ is generated by the roxygenise step rather than committed. Once it is
# committed, replace that step with a check that the committed docs are current
# (roxygenise, then fail on a dirty tree).
name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: 'devel', http-user-agent: 'release' }
          - { os: ubuntu-latest, r: 'release' }
          - { os: ubuntu-latest, r: 'oldrel-1' }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config['http-user-agent'] }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::roxygen2
          needs: check

      # man/ and NAMESPACE are roxygen output. NAMESPACE is committed (it is
      # four export lines and deterministic); man/ is not, so generate it here.
      - name: Generate documentation
        run: roxygen2::roxygenise()
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"note"'
          upload-snapshots: true
